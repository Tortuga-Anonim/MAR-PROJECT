<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Valet Parking - Turnos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            background: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .main-box {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.15);
            padding: 40px 32px;
            min-width: 350px;
            max-width: 95vw;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo {
            width: 60px;
            margin-bottom: 10px;
        }
        h2 {
            color: #198754;
            margin-bottom: 8px;
        }
        .instructions {
            color: #555;
            font-size: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 24px;
            width: 100%;
        }
        .input-box {
            display: flex;
            flex-direction: row;
            gap: 12px;
            width: 100%;
        }
        #numberInput {
            flex: 1;
            padding: 10px;
            font-size: 18px;
            border-radius: 8px;
            border: 1px solid #198754;
            outline: none;
            transition: border 0.2s;
            background: #fff;
            color: #222;
        }
        #numberInput:focus {
            border: 1.5px solid #198754;
        }
        button {
            padding: 10px 18px;
            font-size: 16px;
            background: #198754;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover, button:focus {
            background: #145c32;
        }
        #queueBox {
            min-width: 220px;
            min-height: 44px;
            border: 2px solid #198754;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 12px;
            background: #fff;
            box-shadow: 0 4px 24px rgba(25,135,84,0.10), 0 1.5px 8px rgba(0,0,0,0.06);
            width: 100%;
        }
        .queue-item {
            background: #f8f9fa;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 17px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 1px 4px rgba(25,135,84,0.10);
            border-left: 5px solid #198754;
            justify-content: space-between;
        }
        .queue-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .timestamp {
            color: #198754;
            font-size: 13px;
            font-style: italic;
        }
        .delete-btn {
            background: #ef4444;
            border: none;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 18px;
            line-height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 6px;
        }
        .delete-btn:hover, .delete-btn:focus {
            background: #b91c1c;
        }
        @media (max-width: 500px) {
            .main-box {
                padding: 16px 4vw;
                min-width: unset;
            }
            .input-box {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="main-box">
        <!-- Optional logo: <img src="logo.png" class="logo" alt="Valet Parking Logo"> -->
        <h2>Valet Parking</h2>
        <div class="instructions">
            Introduzca el número de su ticket para agregarlo a la fila.<br>
            Pulse el botón para eliminarlo cuando el auto haya sido entregado.
        </div>
        <div class="container">
            <div class="input-box">
                <input type="number" id="numberInput" placeholder="Número de ticket" aria-label="Número de ticket">
                <button onclick="addToQueue()" aria-label="Agregar ticket">Agregar</button>
            </div>
            <div id="queueBox" aria-live="polite"></div>
        </div>
    </div>
    <script>
        function addToQueue() {
            const input = document.getElementById('numberInput');
            const value = input.value.trim();
            if (!value) return;
            const queueBox = document.getElementById('queueBox');
            const item = document.createElement('div');
            item.className = 'queue-item';

            const infoDiv = document.createElement('div');
            infoDiv.className = 'queue-info';

            const numberSpan = document.createElement('span');
            numberSpan.textContent = value;

            // Add timestamp
            const timestamp = document.createElement('span');
            timestamp.className = 'timestamp';
            const now = new Date();
            timestamp.textContent = now.toLocaleString();

            infoDiv.appendChild(numberSpan);
            infoDiv.appendChild(timestamp);

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.textContent = '×';
            deleteBtn.setAttribute('aria-label', 'Eliminar ticket');
            deleteBtn.onclick = function() {
                queueBox.removeChild(item);
            };

            item.appendChild(infoDiv);
            item.appendChild(deleteBtn);
            queueBox.appendChild(item);

            input.value = '';
            input.focus();
        }

        document.getElementById('numberInput').addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                addToQueue();
            }
        });
    </script>
</body>
</html>
