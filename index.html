<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Nike Valet Parking - Turnos</title>
		<link rel="stylesheet" href="css/style.css" />
	</head>
	<body>
		<div class="role-box" id="roleBox">
			<img
				src="https://uploads.onecompiler.io/43rfzcgh6/43rfzcxax/imagen%20valet%20parking%202.jpg"
				alt="Club de la Lagunita"
				class="logo-lagunita"
			/>
			<h2>¿Quién eres?</h2>
			<div class="role-btns">
				<button onclick="selectRole('cliente')">Cliente</button>
				<button onclick="selectRole('parkero')">Parkero</button>
			</div>
		</div>
		<div class="login-box" id="loginBox" style="display: none">
			<img
				src="https://uploads.onecompiler.io/43rfzcgh6/43rfzcxax/imagen%20valet%20parking%202.jpg"
				alt="Club de la Lagunita"
				class="logo-lagunita"
			/>
			<h2>Iniciar sesión Parkero</h2>
			<form class="login-form" id="loginForm" autocomplete="off">
				<input type="text" id="username" placeholder="Usuario" required />
				<input
					type="password"
					id="password"
					placeholder="Contraseña"
					required
				/>
				<button type="submit">Entrar</button>
				<div class="error-msg" id="loginError" style="display: none"></div>
			</form>
			<button class="logout-btn" onclick="backToRole()">Volver</button>
		</div>
		<div class="main-box" id="mainBox" style="display: none">
			<img
				src="https://uploads.onecompiler.io/43rfzcgh6/43rfzcxax/imagen%20valet%20parking%202.jpg"
				alt="Club de la Lagunita"
				class="logo-lagunita"
			/>
			<h2>Valet Parking</h2>
			<div class="instructions" id="instructions"></div>
			<div class="notify" id="notifyBox"></div>
			<div class="container">
				<div class="input-box" id="inputBox">
					<input
						type="number"
						id="numberInput"
						placeholder="Número de ticket"
						aria-label="Número de ticket"
					/>
					<button
						id="addBtn"
						onclick="addToQueue()"
						aria-label="Agregar ticket"
					>
						Agregar
					</button>
				</div>
				<button id="removeBtn" class="remove-btn" onclick="removeMyTicket()">
					Cancelar retiro
				</button>
				<div id="queueBox" aria-live="polite"></div>
			</div>
			<button
				class="logout-btn"
				id="logoutBtn"
				onclick="logout()"
				style="display: none"
			>
				Cerrar sesión
			</button>
			<button
				class="logout-btn"
				onclick="backToRole()"
				style="margin-top: 10px"
			>
				Volver
			</button>
		</div>

		<script src="js/script.js"></script>
		<!-- Añadir antes del cierre de </body> -->
		<script>
			// Inicialización segura
			document.addEventListener("DOMContentLoaded", () => {
				if (typeof initWebSocket === "function") {
					initWebSocket();
				}
				showRole();
			});
		</script>
	</body>
</html>
