<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Nike Valet Parking - Turnos</title>
		<link rel="stylesheet" href="css/style.css" />
	</head>
	<body>
		<!-- Pantalla de selección de rol -->
		<div class="role-box" id="roleBox">
			<img
				src="https://uploads.onecompiler.io/43rfzcgh6/43rfzcxax/imagen%20valet%20parking%202.jpg"
				alt="Logo Nike Valet Parking"
				class="logo-dinamico"
			/>
			<h2>¿Quién eres?</h2>
			<div class="role-btns">
				<button onclick="selectRole('cliente')" class="role-btn">
					Cliente
				</button>
				<button onclick="selectRole('parkero')" class="role-btn">
					Parkero
				</button>
			</div>
		</div>

		<!-- Pantalla de login para parkeros -->
		<div class="login-box" id="loginBox">
			<img
				src="https://uploads.onecompiler.io/43rfzcgh6/43rfzcxax/imagen%20valet%20parking%202.jpg"
				alt="Logo Nike Valet Parking"
				class="logo-dinamico"
			/>
			<h2>Iniciar sesión Parkero</h2>
			<form id="loginForm" class="login-form" autocomplete="off">
				<div class="form-group">
					<input type="text" id="username" placeholder="Usuario" required />
				</div>
				<div class="form-group">
					<input
						type="password"
						id="password"
						placeholder="Contraseña"
						required
					/>
				</div>
				<button type="submit" class="submit-btn">Entrar</button>
				<div class="error-msg" id="loginError"></div>
			</form>
			<button onclick="backToRole()" class="back-btn">Volver</button>
		</div>

		<!-- Pantalla principal de la aplicación -->
		<div class="main-box" id="mainBox">
			<img
				src="https://uploads.onecompiler.io/43rfzcgh6/43rfzcxax/imagen%20valet%20parking%202.jpg"
				alt="Logo Nike Valet Parking"
				class="logo-dinamico"
			/>
			<h2>Valet Parking</h2>

			<div class="notification" id="notifyBox"></div>

			<div class="instructions" id="instructions"></div>

			<div class="ticket-controls">
				<div class="input-box" id="inputBox">
					<input
						type="number"
						id="numberInput"
						placeholder="Número de ticket"
						aria-label="Número de ticket"
						min="1"
					/>
					<button id="addBtn" onclick="addToQueue()" class="action-btn">
						Agregar
					</button>
				</div>

				<button id="removeBtn" onclick="removeMyTicket()" class="remove-btn">
					Cancelar retiro
				</button>
			</div>

			<div id="queueBox" class="queue-container" aria-live="polite"></div>

			<div class="action-buttons">
				<button id="logoutBtn" onclick="logout()" class="logout-btn">
					Cerrar sesión
				</button>
				<button onclick="backToRole()" class="back-btn">Volver</button>
			</div>
		</div>

		<script src="js/script.js"></script>
		<!-- Añadir antes del cierre de </body> -->
		<script>
			// Inicialización segura
			document.addEventListener("DOMContentLoaded", () => {
				if (typeof initWebSocket === "function") {
					initWebSocket();
				}
				showRole();
			});
		</script>
	</body>
</html>
