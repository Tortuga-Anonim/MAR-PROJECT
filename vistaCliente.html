<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="cliente.css" />
		<link rel="icon" href="la lagunita.png" type="image/x-icon" />
		<title>Document</title>
	</head>
	<body>
		<header class="header">
			<img class="logo" src="la lagunita.png" alt="logo" />
			<h1 class="title">Servicio de Valet Parking</h1>
		</header>
		<main>
			<section class="ticket-form">
				<article class="new-ticket">
					<form class="new-ticket-form" action="">
						<input
							type="text"
							placeholder="Introduzca el número de su ticket"
						/>
						<button>Retirar</button>
					</form>
				</article>
				<article class="cancel-ticket">
					<form action="">
						<button>cancelar retiro</button>
					</form>
				</article>
			</section>
			<section class="ticket-queue"></section>
		</main>
	</body>
</html>
