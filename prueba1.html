<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Number Queue</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            background: #1A1A1A;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .main-box {
            background: #1E1E1E;
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 40px 32px;
            min-width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 {
            color: #2563eb;
            margin-bottom: 24px;
        }
        .container {
            display: flex;
            align-items: flex-start;
            gap: 24px;
        }
        .input-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        #numberInput {
            padding: 10px;
            font-size: 18px;
            border-radius: 8px;
            border: 1px solid #bcd0ee;
            outline: none;
            transition: border 0.2s;
        }
        #numberInput:focus {
            border: 1.5px solid #2563eb;
        }
        button {
            padding: 10px 18px;
            font-size: 16px;
            background: #C8A74F;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #1746a0;
        }
        #queueBox {
            min-width: 220px;
            min-height: 44px;
            border: 2px solid #C8A74F;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: #eaf1fb;
        }
        .queue-item {
            background: #353430;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 17px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 1px 4px rgba(37,99,235,0.08);
        }
        .delete-btn {
            background: #ef4444;
            border: none;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 18px;
            line-height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 6px;
        }
        .delete-btn:hover {
            background: #b91c1c;
        }
    </style>
</head>
<body>
    <div class="main-box">
        <h2>Enter a number</h2>
        <div class="container">
            <div class="input-box">
                <input type="number" id="numberInput" placeholder="Enter number">
                <button onclick="addToQueue()">Add</button>
            </div>
            <div id="queueBox"></div>
        </div>
    </div>
    <script>
        function addToQueue() {
            const input = document.getElementById('numberInput');
            const value = input.value.trim();
            if (!value) return;
            const queueBox = document.getElementById('queueBox');
            const item = document.createElement('div');
            item.className = 'queue-item';

            const numberSpan = document.createElement('span');
            numberSpan.textContent = value;

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.textContent = '×';
            deleteBtn.onclick = function() {
                queueBox.removeChild(item);
            };

            item.appendChild(numberSpan);
            item.appendChild(deleteBtn);
            queueBox.appendChild(item);

            input.value = '';
            input.focus();
        }

        document.getElementById('numberInput').addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                addToQueue();
            }
        });
    </script>
</body>
</html>
